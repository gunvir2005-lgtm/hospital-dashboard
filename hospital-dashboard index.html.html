<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Resource Prediction Dashboard</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>
:root{--bg:#f3f7fd;--card:#fff;--tx:#0f2747;--mu:#5b6f8a;--bd:#d9e5f4;--pri:#1d4ed8;--sky:#0ea5e9;--red:#dc2626;--amb:#d97706;--grn:#059669;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1322;--card:#111d33;--tx:#e6eefb;--mu:#93a4bf;--bd:#1f2f4d;--pri:#60a5fa;--sky:#38bdf8}}
:root[data-theme="dark"]{--bg:#0a1322;--card:#111d33;--tx:#e6eefb;--mu:#93a4bf;--bd:#1f2f4d;--pri:#60a5fa;--sky:#38bdf8}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}

select,input[type=number]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:14px}

.sc{overflow-x:auto}
</style></head><body><div id="root"></div>
<script>
const {useState,useMemo}=React,html=htm.bind(React.createElement);
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;
const dowOf=d=>new Date(d+'T00:00:00Z').getUTCDay();
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const iso=s=>{s=String(s||'');let m=s.match(/^(\d{4})-(\d\d)-(\d\d)/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):null};

/* ---------- Demo data (synthetic, seeded, no real patients) ---------- */
function sampleData(){
 let s=42;const rnd=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296,g=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(2*Math.PI*rnd());
 const D=[['Emergency',40,22,1.6,5,11],['ICU',20,4,3.8,3,10],['General Medicine',80,14,4.5,6,14],['Surgery',50,9,4,5,10],['Pediatrics',30,6,3.5,3,6],['Maternity',24,5,3,3,5]];
 const W=[.82,1.12,1.08,1.03,1,.98,.97],daily=[];
 D.forEach(([dept,beds,base,los,dc,nu])=>{let occ=base*los*.85;
  for(let i=0;i<365;i++){const date=addDays('2025-10-14',i),mean=base*W[dowOf(date)]*(1+.1*Math.cos(2*Math.PI*(i-90)/365))*(1+.0003*i);
   const adm=Math.max(0,Math.round(mean+Math.sqrt(mean)*g()));occ=Math.min(beds*1.02,occ*(1-1/los)+adm);
   daily.push({date,dept,adm,dis:Math.round(occ/los),occ:Math.round(occ),beds,docs:Math.max(1,Math.round(dc+.5*g())),nurses:Math.max(1,Math.round(nu+.7*g()))})}});
 return {daily,caps:deriveCaps(daily),source:'demo'}}
function deriveCaps(daily){const g={};daily.forEach(r=>(g[r.dept]=g[r.dept]||[]).push(r));const c={};
 for(const d in g){const L=g[d].sort((a,b)=>a.date<b.date?-1:1).slice(-28),m=f=>{const v=L.map(r=>r[f]).filter(x=>x>0);return v.length?Math.round(avg(v)):null};
  c[d]={beds:Math.max(...L.map(r=>r.beds||0))||null,docs:m('docs'),nurses:m('nurses')}}return c}

/* ---------- Forecast engine: day-of-week seasonality + 8-week trend + Little's-law bed flow ---------- */
function fcAdm(y,dates,H){
 const W=Math.min(56,y.length),s=y.length-W,ys=y.slice(s),ds=dates.slice(s),m=avg(ys)||1,f=Array(7).fill(0),c=Array(7).fill(0);
 ys.forEach((v,i)=>{const k=dowOf(ds[i]);f[k]+=v;c[k]++});const fac=f.map((v,k)=>c[k]?v/c[k]/m:1);
 const z=ys.map((v,i)=>v/fac[dowOf(ds[i])]),zm=avg(z),xm=(W-1)/2;let sxy=0,sxx=0;z.forEach((v,i)=>{sxy+=(i-xm)*(v-zm);sxx+=(i-xm)**2});
 let b=sxx?sxy/sxx:0;const cap=.01*zm;b=Math.max(-cap,Math.min(cap,b));const a=zm-b*xm;
 const sd=Math.sqrt(avg(ys.map((v,i)=>(v-(a+b*i)*fac[dowOf(ds[i])])**2))),last=dates[dates.length-1],fd=[],p=[];
 for(let h=1;h<=H;h++){const d=addDays(last,h);fd.push(d);p.push(Math.max(0,(a+b*(W-1+h))*fac[dowOf(d)]))}
 return {p,fd,sd}}
function run(data,P){
 const alld=[...new Set(data.daily.map(r=>r.date))].sort(),by={};data.daily.forEach(r=>(by[r.dept]=by[r.dept]||{})[r.date]=r);
 const depts=[];
 for(const name in by){let prev=0;const R=alld.map(d=>by[name][d]||{date:d,adm:0,dis:0,occ:prev});R.forEach(r=>prev=r.occ);
  const adm=R.map(r=>r.adm),occ=R.map(r=>r.occ),n=R.length,F=fcAdm(adm,alld,30),alos=Math.max(1,avg(occ.slice(-28))/Math.max(.1,avg(adm.slice(-28)))),phi=1-1/alos;
  let pv=occ[n-1];const fo=F.p.map(p=>pv=pv*phi+p),bw=1.28*F.sd*Math.sqrt(alos/2),k=data.caps[name]||{};
  const beds=k.beds||Math.ceil(Math.max(...occ)*1.15),peak=Math.max(...fo),reqBeds=Math.ceil(peak/P.target),docReq=Math.ceil(peak/P.pd),nurReq=Math.ceil(peak/P.pn);
  const bt=n>=90?fcAdm(adm.slice(0,-30),alld.slice(0,-30),30).p:null;
  depts.push({name,dates:alld,fd:F.fd,adm,occ,fa:F.p,fo,ahi:F.p.map(v=>v+1.28*F.sd),alo:F.p.map(v=>Math.max(0,v-1.28*F.sd)),hi:fo.map(v=>v+bw),lo:fo.map(v=>Math.max(0,v-bw)),alos,beds,reqBeds,shortBeds:Math.max(0,reqBeds-beds),
   docAv:k.docs??null,nurAv:k.nurses??null,docReq,nurReq,docShort:k.docs==null?0:Math.max(0,docReq-k.docs),nurShort:k.nurses==null?0:Math.max(0,nurReq-k.nurses),bt})}
 let mape=null;const bd=depts.filter(d=>d.bt);if(bd.length){const act=[],pr=[];for(let i=0;i<30;i++){act.push(sum(bd.map(d=>d.adm[d.adm.length-30+i])));pr.push(sum(bd.map(d=>d.bt[i])))}mape=avg(act.map((a,i)=>a?Math.abs(pr[i]-a)/a:0))*100}
 return {depts,mape}}
const ARR=['adm','occ','fa','fo','hi','lo','ahi','alo'],SC=['beds','reqBeds','shortBeds','docReq','nurReq','docShort','nurShort'];
function agg(L){if(L.length<2)return L[0];const o={name:'All departments',dates:L[0].dates,fd:L[0].fd};
 ARR.forEach(k=>o[k]=L[0][k].map((_,i)=>sum(L.map(d=>d[k][i]))));SC.forEach(k=>o[k]=sum(L.map(d=>d[k])));
 ['docAv','nurAv'].forEach(k=>o[k]=L.some(d=>d[k]==null)?null:sum(L.map(d=>d[k])));return o}

/* ---------- Upload parsing (runs in the browser; nothing leaves the device) ---------- */
function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);R.push(r)}const h=R.shift().map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_'));return R.filter(a=>a.length>1).map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
async function readFile(f){if(/\.csv$/i.test(f.name))return parseCSV(await f.text());
 const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
 return XLSX.utils.sheet_to_json(ws,{raw:false,defval:'',dateNF:'yyyy-mm-dd'}).map(o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k.trim().toLowerCase().replace(/[\s-]+/g,'_'),String(v).trim()])))}
function ingest(rows){
 if(!rows.length)throw 'The file has no data rows.';const k=Object.keys(rows[0]),has=x=>k.includes(x),num=v=>v===''||v==null||isNaN(+v)?null:+v;
 const ignored=k.filter(c=>/name|mrn|phone|address|dob|birth|aadhaar|ssn|email|patient_id|^id$/.test(c));let daily=[];
 if(has('admission_date')&&has('department')){
  const P=rows.map(r=>({a:iso(r.admission_date),d:iso(r.discharge_date),p:r.department||'Unassigned'})).filter(r=>r.a&&(!r.d||r.d>=r.a));
  if(!P.length)throw 'No valid admission_date values found (use YYYY-MM-DD or DD/MM/YYYY).';
  const lo=P.reduce((m,r)=>r.a<m?r.a:m,'9'),hi=P.reduce((m,r)=>(r.d||r.a)>m?(r.d||r.a):m,'0'),days=[];for(let d=lo;d<=hi&&days.length<4000;d=addDays(d,1))days.push(d);
  const ix=Object.fromEntries(days.map((d,i)=>[d,i])),G={};
  P.forEach(r=>{const o=G[r.p]=G[r.p]||{adm:Array(days.length).fill(0),dis:Array(days.length).fill(0),dv:Array(days.length+1).fill(0)};o.adm[ix[r.a]]++;o.dv[ix[r.a]]++;if(r.d){o.dis[ix[r.d]]++;o.dv[ix[r.d]]--}});
  for(const p in G){let c=0;days.forEach((d,i)=>{c+=G[p].dv[i];daily.push({date:d,dept:p,adm:G[p].adm[i],dis:G[p].dis[i],occ:c})})}
 }else if(has('date')&&has('department')&&has('admissions')){
  if(!has('occupied_beds'))throw 'Daily format needs an occupied_beds column.';
  daily=rows.map(r=>({date:iso(r.date),dept:r.department,adm:num(r.admissions)||0,dis:num(r.discharges)||0,occ:num(r.occupied_beds)||0,beds:num(r.total_beds),docs:num(r.doctors),nurses:num(r.nurses)})).filter(r=>r.date&&r.dept);
 }else if(has('department')&&(has('doctors')||has('nurses')||has('total_beds'))){
  const caps={};rows.forEach(r=>caps[r.department]={beds:num(r.total_beds),docs:num(r.doctors),nurses:num(r.nurses)});return {caps,ignored}}
 else throw 'Columns not recognised. See the accepted formats below.';
 if(!daily.length)throw 'No usable rows found.';return {daily,caps:deriveCaps(daily),ignored}}

/* ---------- Insights, downloads ---------- */
function insights(M,P){const A=[],R=[];
 M.depts.forEach(d=>{const i9=d.fo.findIndex(v=>v>d.beds*.9),i1=d.fo.findIndex(v=>v>d.beds);
  if(i1>=0)A.push({s:'critical',t:`${d.name}: occupied beds forecast to exceed capacity (${d.beds}) around ${d.fd[i1]}.`});else if(i9>=0)A.push({s:'warning',t:`${d.name}: occupancy forecast to pass 90% of capacity around ${d.fd[i9]}.`});
  if(d.shortBeds)R.push(`${d.name}: plan for ${d.shortBeds} additional bed(s) (or faster discharges / diversion) to hold ${Math.round(P.target*100)}% target occupancy at the forecast peak.`);
  if(d.docShort)A.push({s:'warning',t:`${d.name}: short by ${d.docShort} doctor(s) at forecast peak.`}),R.push(`${d.name}: add ${d.docShort} doctor shift(s) or arrange cover.`);
  if(d.nurShort)A.push({s:'warning',t:`${d.name}: short by ${d.nurShort} nurse(s) at forecast peak.`}),R.push(`${d.name}: add ${d.nurShort} nurse shift(s) (overtime, float pool or agency).`)});
 if(!R.length)R.push('No shortages forecast under current assumptions. Keep monitoring weekly.');return {A,R}}
async function save(name,text,type){
 try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data:new Blob([text],{type})});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

/* ---------- UI pieces ---------- */
const Badge=(t,c)=>html`<span style=${{background:`color-mix(in srgb,var(--${c}) 15%,transparent)`,color:`var(--${c})`,padding:'2px 8px',borderRadius:99,fontSize:12,fontWeight:600}}>${t}</span>`;
const Kpi=({l,v,s,c})=>html`<div class="card"><div class="mu text-sm">${l}</div><div class="text-3xl font-bold mt-1" style=${{color:c?`var(--${c})`:'var(--tx)'}}>${v}</div><div class="mu text-xs mt-1">${s}</div></div>`;
function Chart({dates,series,band,split,h=230,title}){
 const [hv,setHv]=useState(null),W=700,p={l:40,r:10,t:10,b:22},n=dates.length,all=series.flatMap(s=>s.v).concat(band?band.hi:[]),mx=Math.max(1,...all)*1.08;
 const X=i=>p.l+i*(W-p.l-p.r)/(n-1),Y=v=>p.t+(1-v/mx)*(h-p.t-p.b),pth=s=>s.v.map((y,i)=>(i?'L':'M')+X(i+s.o).toFixed(1)+' '+Y(y).toFixed(1)).join('');
 const poly=band&&band.hi.map((v,i)=>X(i+band.o).toFixed(1)+','+Y(v).toFixed(1)).concat(band.lo.map((v,i)=>X(i+band.o)+','+Y(v)).reverse()).join(' ');
 const mv=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;setHv(Math.max(0,Math.min(n-1,Math.round((x-p.l)*(n-1)/(W-p.l-p.r)))))};
 return html`<div><div class="flex justify-between text-sm mb-1"><b>${title}</b><span class="mu text-xs">${hv==null?'Hover for values':dates[hv]+' · '+series.map(s=>{const v=s.v[hv-s.o];return v==null?null:s.name+': '+Math.round(v*10)/10}).filter(Boolean).join(' · ')}</span></div>
 <svg viewBox=${`0 0 ${W} ${h}`} style=${{width:'100%',height:'auto'}} onMouseMove=${mv} onMouseLeave=${()=>setHv(null)}>
 ${[0,1,2,3,4].map(k=>html`<g key=${k}><line x1=${p.l} x2=${W-p.r} y1=${Y(mx*k/4)} y2=${Y(mx*k/4)} stroke="var(--bd)"/><text x=${p.l-5} y=${Y(mx*k/4)+4} text-anchor="end" font-size="11" fill="var(--mu)">${Math.round(mx*k/4)}</text></g>`)}
 ${[0,1,2,3,4].map(k=>{const i=Math.round(k*(n-1)/4);return html`<text key=${k} x=${X(i)} y=${h-6} text-anchor="middle" font-size="11" fill="var(--mu)">${dates[i].slice(5)}</text>`})}
 ${split!=null&&html`<line x1=${X(split)} x2=${X(split)} y1=${p.t} y2=${h-p.b} stroke="var(--mu)" stroke-dasharray="4 4"/>`}
 ${band&&html`<polygon points=${poly} fill="var(--sky)" opacity=".18"/>`}
 ${series.map(s=>html`<path key=${s.name} d=${pth(s)} fill="none" stroke=${s.c} stroke-width="2" stroke-dasharray=${s.dash||''}/>`)}
 ${hv!=null&&html`<line x1=${X(hv)} x2=${X(hv)} y1=${p.t} y2=${h-p.b} stroke="var(--mu)" opacity=".5"/>`}</svg>
 <div class="flex gap-4 text-xs mu flex-wrap">${series.map(s=>html`<span key=${s.name}><span style=${{color:s.c}}>●</span> ${s.name}</span>`)}${split!=null&&html`<span>┆ right of line = forecast</span>`}</div></div>`}
const Bars=({rows,a,b,la,lb})=>{const mx=Math.max(1,...rows.flatMap(r=>[r[a]||0,r[b]||0]));
 return html`<div class="space-y-3">${rows.map(r=>html`<div key=${r.name}><div class="text-sm flex justify-between"><span>${r.name}</span><span class="mu">${la} ${r[a]??'—'} · ${lb} ${r[b]}</span></div>
 <div style=${{height:8,background:'color-mix(in srgb,var(--pri) 12%,transparent)',borderRadius:4,marginTop:3}}><div style=${{height:8,width:(r[a]||0)/mx*100+'%',background:'var(--pri)',borderRadius:4}}/></div>
 <div style=${{height:8,background:'color-mix(in srgb,var(--sky) 12%,transparent)',borderRadius:4,marginTop:3}}><div style=${{height:8,width:r[b]/mx*100+'%',background:r[b]>(r[a]??1e9)?'var(--red)':'var(--sky)',borderRadius:4}}/></div></div>`)}</div>`};
const Num=({l,v,set,step=1,min=1,max=99})=>html`<label class="text-sm mu flex items-center gap-2">${l}<input type="number" value=${v} step=${step} min=${min} max=${max} style=${{width:80}} onChange=${e=>set(+e.target.value||v)}/></label>`;
const Sel=({v,set,o})=>html`<select value=${v} onChange=${e=>set(e.target.value)}>${o.map(x=>html`<option key=${x[0]} value=${x[0]}>${x[1]}</option>`)}</select>`;

const tot=(M,k)=>sum(M.depts.map(d=>d[k])),DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const QA={
'Which department has the biggest bed shortage?':M=>{const L=[...M.depts].sort((a,b)=>b.shortBeds-a.shortBeds),d=L[0];return d.shortBeds?`${d.name}: ${d.beds} beds available vs ${d.reqBeds} needed at the forecast peak, a gap of ${d.shortBeds}. Other gaps: ${L.slice(1).filter(x=>x.shortBeds).map(x=>x.name+' ('+x.shortBeds+')').join(', ')||'none'}. Total gap: ${tot(M,'shortBeds')} beds.`:'No department has a bed shortage under the current assumptions.'},
'Will we run out of beds in the next 30 days?':M=>{const L=M.depts.map(d=>({d,i:d.fo.findIndex(v=>v>d.beds)})).filter(x=>x.i>=0);return L.length?'Yes. Forecast occupancy exceeds capacity in: '+L.map(x=>`${x.d.name} (from ${x.d.fd[x.i]})`).join(', ')+'.':'No department is forecast to exceed capacity. Above 90% at peak: '+(M.depts.filter(d=>Math.max(...d.fo)>d.beds*.9).map(d=>d.name).join(', ')||'none')+'.'},
'How many doctors and nurses do we need to add?':M=>{const f=k=>M.depts.filter(d=>d[k]).map(d=>`${d.name} +${d[k]}`).join(', ')||'none';return `Doctors short by ${tot(M,'docShort')} (${f('docShort')}). Nurses short by ${tot(M,'nurShort')} (${f('nurShort')}). Based on forecast peak occupied beds and the patients-per-clinician ratios on the Staff tab.`},
'What is the predicted admission demand next month?':M=>{const n=sum(M.depts.map(d=>sum(d.fa))),p=sum(M.depts.map(d=>sum(d.adm.slice(-30))));return `About ${Math.round(n)} admissions over the next 30 days (${((n/p-1)*100).toFixed(1)}% vs the last 30 days). Largest: ${[...M.depts].sort((a,b)=>sum(b.fa)-sum(a.fa)).slice(0,3).map(d=>d.name+' '+Math.round(sum(d.fa))).join(', ')}.`},
'Which weekday is busiest for admissions?':M=>{const t=Array(7).fill(0),c=Array(7).fill(0);M.depts.forEach(d=>d.adm.slice(-56).forEach((v,i)=>{const k=dowOf(d.dates[d.dates.length-Math.min(56,d.adm.length)+i]);t[k]+=v;c[k]++}));const a=t.map((v,k)=>[k,v/(c[k]/M.depts.length||1)]).sort((x,y)=>y[1]-x[1]);return `${DAY[a[0][0]]} is busiest (about ${Math.round(a[0][1])} admissions/day across all departments); ${DAY[a[6][0]]} is quietest (about ${Math.round(a[6][1])}). Based on the last 8 weeks.`},
'Which department is most crowded right now?':M=>{const L=[...M.depts].sort((a,b)=>b.occ.at(-1)/b.beds-a.occ.at(-1)/a.beds);return L.slice(0,3).map(d=>`${d.name} ${Math.round(d.occ.at(-1)/d.beds*100)}% (${d.occ.at(-1)}/${d.beds})`).join(', ')+' (latest day in the data).'},
'How accurate is the forecast?':M=>M.mape==null?'There is not enough history (90+ days) to run the accuracy check.':`When the model was trained without the last 30 days, it missed total daily admissions by about ${M.mape.toFixed(1)}% on average. Treat forecasts as planning estimates; the shaded ranges show likely variation.`,
'What should we do first?':(M,R)=>R.slice(0,4).map(x=>'• '+x).join('\n')
},QL=Object.keys(QA),KW=[/shortage|short of|more beds|bed gap/,/run out|exceed|full|capacity|over 90/,/doctor|nurse|hire|staff/,/admission|demand|next month|how many patients/,/day|week/,/crowd|current|right now|occupan/,/accura|error|reliab|trust/,/recommend|action|first|should|prior/];
